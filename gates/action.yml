name: Project gates
description: The shared cross-review, security-review and acceptance gates of the project standard, the classify step of ci-ok, and the gate job of the Claude review.
inputs:
  check:
    description: One of cross-review, security-review, acceptance, classify or claude-review.
    required: true
  token:
    description: The token for the GitHub API. The caller gives the job permissions.
    required: false
    default: ${{ github.token }}
outputs:
  code:
    description: For classify only. true if the project jobs must run.
    value: ${{ steps.gate.outputs.code }}
  docs_only:
    description: For classify only. true for a docs-only change.
    value: ${{ steps.gate.outputs.docs_only }}
  reason:
    description: For claude-review only. The reason when the check stops the request.
    value: ${{ steps.gate.outputs.reason }}
  head:
    description: For claude-review only. The head SHA that the check approved for the review.
    value: ${{ steps.gate.outputs.head }}
  base:
    description: For claude-review only. The base branch that the check approved for the review.
    value: ${{ steps.gate.outputs.base }}
  merge_base:
    description: For claude-review only. The merge base of the head and the base when the check ran.
    value: ${{ steps.gate.outputs.merge_base }}
runs:
  using: composite
  steps:
    # The tools come from the same SHA as this file. The caller checks out the base branch of the project, so
    # .github/gates.json and the PR template come from the base branch. No PR file runs.
    - id: gate
      shell: bash
      env:
        GATE_CHECK: ${{ inputs.check }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: python3 -B -I "$GITHUB_ACTION_PATH/gate.py" "$GATE_CHECK"
